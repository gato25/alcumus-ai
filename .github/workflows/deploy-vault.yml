name: Publish vault

# Builds the Quartz site from vault/ and deploys it to GitHub Pages.
# Quartz itself is not vendored — site/quartz.mjs clones it at a pinned tag.
on:
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "site/**"
      - ".github/workflows/deploy-vault.yml"
  workflow_dispatch: # lets you rebuild by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win rather than queue behind an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Quartz dates each note from git history; a shallow clone would make
          # every page look created at checkout time.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: there is no lockfile in this repo — the dependency tree
          # belongs to the Quartz checkout, which is cached wholesale below.

      # Caches the clone and its node_modules together. The pinned tag lives in
      # quartz.mjs, so hashing that file invalidates the cache on upgrade.
      - name: Cache Quartz
        uses: actions/cache@v4
        with:
          path: .quartz-build
          key: quartz-${{ runner.os }}-${{ hashFiles('site/quartz.mjs') }}

      - name: Build site
        run: node site/quartz.mjs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
